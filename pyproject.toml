[project]
name = "ReviewInsight"
version = "0.1.0"
description = "Aspect-based sentiment dashboard and RAG assistant for Vietnamese product reviews"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
